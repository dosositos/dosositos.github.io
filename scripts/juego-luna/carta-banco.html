<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La carta de la luna, sobre el teléfono</title>
  </head>
  <body>
    <!--
      El banco de la carta. No es parte de la web.

      Lo que se juzga acá es **cómo se lee en el teléfono de ella**:
      cuánto hay que bajar, si el papel se come la luna demasiado
      pronto, si la apertura manuscrita aguanta el largo que tiene, si
      el cierre cae donde tiene que caer.

      Va con relleno de los mismos largos que la carta de verdad y no
      con la carta de verdad, por dos motivos. El primero es que las
      palabras están cifradas y hacen falta la clave y tres capítulos
      ganados para verlas. El segundo es que son de él para ella y no
      tienen por qué andar sueltas por un banco.

      Se mira con el servidor de siempre andando:
        npm run dev
        http://localhost:5173/scripts/juego-luna/carta-banco.html
    -->
    <div id="banco"></div>
    <script type="module" src="/scripts/juego-luna/carta-banco.tsx"></script>
  </body>
</html>
